name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v

      - name: CLI smoke tests
        run: |
          python -m gewum.main --version
          python -m gewum.main --help

      - name: Lint (tests)
        run: |
          black --check tests/
          flake8 tests/

  clean-install:
    name: Clean install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install from source (non-editable)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify console entry point
        run: |
          gewum --version
          gewum --help

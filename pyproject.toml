[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gewum"
version = "1.0.0"
description = "GEWUM: General Exploration Workflow for the Utopia of Materials"
readme = "GEWUM_Manual.md"
license = {text = "MIT"}
authors = [
    {name = "Jiexi Song", email = "songjx@szlab.ac.cn"}
]
requires-python = ">=3.8"
dependencies = [
    # Core scientific computing
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "scipy>=1.7",
    # Atomistic simulation & crystal structure
    "ase>=3.22",
    "pymatgen>=2022.0",
    "pyyaml>=5.4",
    "spglib>=2.0",
    "pyxtal>=0.6",
    # Phonon calculations
    "phonopy>=2.20",
    "phono3py>=2.0",
    # Materials Project API & offline data parsing
    "mp-api>=0.30",
    "ijson>=3.1",
    # Machine learning (structure selection & visualization)
    "scikit-learn>=1.0",
    "dscribe>=1.2",
    "hdbscan>=0.8",
    "umap-learn>=0.5",
    # Utilities
    "tqdm>=4.60",
]

[project.optional-dependencies]
ml = [
    "mattersim>=1.0",
]
dev = [
    "pytest",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/JesseOOPP/GEWUM"
Documentation = "https://github.com/JesseOOPP/GEWUM"
Repository = "https://github.com/JesseOOPP/GEWUM"

[project.scripts]
gewum = "gewum.main:main"

[tool.setuptools]
package-dir = {"gewum" = "."}

[tool.setuptools.packages.find]
include = ["gewum*"]

[tool.setuptools.package-data]
"gewum" = [
    "src/**/*.py",
    "src/**/*.sh",
    "src/**/*.in*",
    "src/**/INPUT",
    "src/**/*.yaml",
    "slurm_config.yaml",
]
